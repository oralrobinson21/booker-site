<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CityTask Login</title><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-slate-50'>
<main class='max-w-md mx-auto mt-16 bg-white p-6 rounded shadow'><h1 class='text-2xl font-bold mb-4'>Log in</h1><form id='f' class='space-y-2'><input name='email' type='email' required class='w-full border p-2 rounded'><input name='password' type='password' required class='w-full border p-2 rounded'><button class='w-full bg-indigo-600 text-white p-2 rounded'>Log in</button></form><p id='m' class='text-sm mt-2'></p><a href='/signup.html' class='text-indigo-700'>Create account</a></main>
<script type='module'>import {login,currentUser} from './src/citytask.js';if(currentUser())location.href='/dashboard.html';document.getElementById('f').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);try{login(fd.get('email'),fd.get('password'));location.href='/dashboard.html';}catch(err){m.textContent=err.message;}};</script>
</body></html>

<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CityTask Signup</title><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-slate-50'>
<main class='max-w-md mx-auto mt-16 bg-white p-6 rounded shadow'><h1 class='text-2xl font-bold mb-4'>Create account</h1><form id='f' class='space-y-2'><input name='email' type='email' required placeholder='Email' class='w-full border p-2 rounded'><input name='password' type='password' required placeholder='Password' class='w-full border p-2 rounded'><button class='w-full bg-indigo-600 text-white p-2 rounded'>Sign up</button></form><p id='m' class='text-sm mt-2'></p><a href='/login.html' class='text-indigo-700'>Log in</a></main>
<script type='module'>import {signup} from './src/citytask.js';document.getElementById('f').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);try{signup(fd.get('email'),fd.get('password'));location.href='/dashboard.html';}catch(err){m.textContent=err.message;}};</script>
</body></html>
